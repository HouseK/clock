<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="A persistent, always-on background clock with solar-aware lighting modes. Designed for zero-interaction environments."
        />
        <title>Clock</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500;700&display=swap"
            rel="stylesheet"
        />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    </head>
    <body>
        <div class="layout-wrapper">
            <div class="clock-container" id="markers">
                <div class="hand hour-hand"></div>
                <div class="hand min-hand"></div>
                <div class="hand sec-hand"></div>
                <div class="center-dot"></div>
            </div>

            <div class="digital-wrap">
                <div id="time">00:00:00</div>
                <div id="date">MONDAY, JAN 01</div>
                <div id="holiday-text" class="status-text"></div>
                <div id="leet-text" class="status-text">
                    SYSTEM.LEET_MODE_ACTIVE
                </div>
            </div>
        </div>

        <div class="solar-timeline-wrap">
            <div id="solar-timeline" class="solar-timeline">
                <!-- Markers will be injected by JS -->
                <div class="sun-marker"></div>
            </div>
            <div class="telemetry-stack">
                <div id="solar-status" class="status-badge">Solar Sync...</div>
                <div id="location-badge" class="status-badge technical">
                    GPS Sync...
                </div>
            </div>
        </div>

        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
